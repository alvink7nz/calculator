<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathegraphical | Prime calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <img class="mark" src="mathegraphicallogo.svg" alt="Mathegraphical logo">
        <div>
          <h1>Mathegraphical</h1>
          <p class="subtitle">A minimalistic, compact, and customizable calculator</p>
        </div>
      </div>
      <div class="hint">Check if a number is prime</div>
    </header>
    <main class="prime-main">
      <section class="tool-panel prime-panel" aria-label="Prime calculator section">
        <p class="eyebrow">Prime calculator</p>
        <h2>Is this number prime?</h2>
        <label class="text-input-label" for="prime-input">Number</label>
        <div class="prime-controls">
          <input class="prime-input" id="prime-input" type="number" min="0" step="1" value="2" placeholder="Enter a number">
          <button class="prime-button" id="prime-button" type="button">Check</button>
        </div>
        <div id="prime-result" class="prime-status" aria-live="polite">Enter a whole number to check.</div>
      </section>
    </main>
  </div>
  <nav class="side-tabs" aria-label="Calculator navigation">
    <a class="side-tab" href="index.html">Home</a>
    <a class="side-tab" href="graphingcalculator.html">Graphing</a>
    <a class="side-tab" href="regularcalculator.html">Regular</a>
    <a class="side-tab" href="scientificcalculator.html">Scientific</a>
    <a class="side-tab active" href="primecalculator.html" aria-current="page">Prime</a>
    <a class="side-tab" href="colorcalculator.html">Color</a>
    <a class="side-tab" href="moneyconverter.html">Money</a>
    <a class="side-tab" href="discountcalculator.html">Discount</a>
  </nav>
  <div class="settings-launcher">
    <section class="settings-panel" id="settings-panel" hidden aria-labelledby="settings-title">
      <button class="settings-close" id="settings-close" type="button" aria-label="Close settings">×</button>
      <h2 id="settings-title">Settings</h2>
      <div class="settings-content">
        <p class="settings-section-title">Colors</p>
        <label class="color-setting">Accent <input type="color" data-color-variable="--accent" value="#e85d45"></label>
        <label class="color-setting">Ink <input type="color" data-color-variable="--ink" value="#152333"></label>
        <label class="color-setting">Paper <input type="color" data-color-variable="--paper" value="#f5f1e9"></label>
        <label class="color-setting">Panel <input type="color" data-color-variable="--panel" value="#fffdf8"></label>
        <p class="settings-section-title">Typography</p>
        <label class="font-setting">Font family <select id="font-family"><option value="Georgia">Georgia</option><option value="Arial">Arial</option><option value="Verdana">Verdana</option><option value="Courier New">Courier New</option></select></label>
        <label class="font-setting">Font size <span><input id="font-size" type="range" min="13" max="22" value="16"><output id="font-size-value">16px</output></span></label>
        <label class="font-setting">Line spacing <span><input id="line-height" type="range" min="1" max="2" step=".1" value="1.4"><output id="line-height-value">1.4</output></span></label>
        <p class="settings-section-title">Display</p>
        <label class="font-setting">Decimal places <select id="decimal-places"><option value="auto">Automatic</option><option value="0">0 decimal places</option><option value="1">1 decimal place</option><option value="2">2 decimal places</option><option value="3">3 decimal places</option><option value="4">4 decimal places</option><option value="5">5 decimal places</option><option value="6">6 decimal places</option><option value="7">7 decimal places</option><option value="8">8 decimal places</option><option value="9">9 decimal places</option><option value="10">10 decimal places</option></select></label>
        <label class="font-setting">Theme <select id="theme-mode"><option value="light">Light mode</option><option value="dark">Dark mode</option><option value="system">System default</option></select></label>
        <label class="font-setting">Button style <select id="button-style"><option value="rounded">Rounded</option><option value="square">Square</option><option value="pill">Pill-shaped</option></select></label>
      </div>
      <button class="settings-reset" id="settings-reset" type="button">Reset settings</button>
    </section>
    <button class="settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">Settings</button>
  </div>
  <script>
    const primeInput = document.getElementById('prime-input');
    const primeResult = document.getElementById('prime-result');
    const primeButton = document.getElementById('prime-button');
    const STORAGE_KEY = 'mathegraphical-prime-state';

    function isPrime(num) {
      if (!Number.isInteger(num) || num < 2) {
        return false;
      }
      if (num === 2) {
        return true;
      }
      if (num % 2 === 0) {
        return false;
      }

      const limit = Math.sqrt(num);
      for (let i = 3; i <= limit; i += 2) {
        if (num % i === 0) {
          return false;
        }
      }
      return true;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ value: primeInput.value }));
      } catch {
        // Ignore storage failures.
      }
    }

    function restoreState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (typeof saved.value === 'string') primeInput.value = saved.value;
      } catch {
        primeInput.value = '2';
      }
    }

    function setResult(message, type = 'neutral') {
      primeResult.textContent = message;
      primeResult.className = 'prime-status';
      if (type === 'success') {
        primeResult.classList.add('success');
      } else if (type === 'error') {
        primeResult.classList.add('error');
      }
    }

    function checkPrime() {
      const rawValue = primeInput.value.trim();
      const value = Number(rawValue);

      if (rawValue === '') {
        setResult('Please enter a number.', 'error');
        saveState();
        return;
      }

      if (!Number.isInteger(value)) {
        setResult('Please enter a whole number.', 'error');
        saveState();
        return;
      }

      if (isPrime(value)) {
        setResult(`${value} is a prime number.`, 'success');
      } else {
        setResult(`${value} is not a prime number.`, 'error');
      }

      saveState();
    }

    primeButton.addEventListener('click', checkPrime);
    primeInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        checkPrime();
      }
    });
    primeInput.addEventListener('input', () => {
      saveState();
      if (primeInput.value.trim() === '') {
        setResult('Enter a whole number to check.', 'neutral');
      }
    });

    restoreState();
    checkPrime();
  </script>
  <script src="settings.js"></script>
</body>
</html>
