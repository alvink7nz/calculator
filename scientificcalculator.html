<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathegraphical | Scientific Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header>
            <div class="brand">
                <img class="mark" src="mathegraphicallogo.svg" alt="Mathegraphical logo">
                <div><h1>Mathegraphical</h1><p class="subtitle">A scientific calculator</p></div>
            </div>
            <div class="hint">Scientific tools</div>
        </header>
        <main class="calculator-main">
            <section class="calculator scientific-calculator" aria-label="Scientific calculator">
                <div class="scientific-heading">
                    <div>
                        <p class="eyebrow">Scientific calculator</p>
                        <h2>Explore the numbers</h2>
                    </div>
                    <button class="mode-toggle" id="angle-mode" type="button">DEG</button>
                </div>
                <input id="scientific-display" type="text" value="0" aria-label="Scientific calculator display" readonly>
                <section class="scientific-keys" aria-label="Scientific calculator keys">
                    <button class="function" data-value="sin(">sin</button>
                    <button class="function" data-value="cos(">cos</button>
                    <button class="function" data-value="tan(">tan</button>
                    <button class="function" data-value="log(">log</button>
                    <button class="function" data-value="ln(">ln</button>
                    <button class="function" data-value="sqrt(">√</button>
                    <button class="function" data-value="^2">x²</button>
                    <button class="function" data-value="^">xʸ</button>
                    <button class="constant" data-value="π">π</button>
                    <button class="constant" data-value="e">e</button>
                    <button data-value="(">(</button>
                    <button data-value=")">)</button>
                    <button class="clear" data-action="clear">C</button>
                    <button data-action="backspace">⌫</button>
                    <button class="operator" data-value="%">%</button>
                    <button class="operator" data-value="÷">÷</button>
                    <button data-value="7">7</button><button data-value="8">8</button>
                    <button data-value="9">9</button><button class="operator" data-value="×">×</button>
                    <button data-value="4">4</button><button data-value="5">5</button>
                    <button data-value="6">6</button><button class="operator" data-value="−">−</button>
                    <button data-value="1">1</button><button data-value="2">2</button>
                    <button data-value="3">3</button><button class="operator" data-value="+">+</button>
                    <button data-value="0">0</button><button data-value=".">.</button>
                    <button class="equals" data-action="equals">=</button>
                </section>
            </section>
        </main>
    </div>
    <nav class="side-tabs" aria-label="Calculator navigation">
        <a class="side-tab" href="index.html">Home</a>
        <a class="side-tab" href="graphingcalculator.html">Graphing</a>
        <a class="side-tab" href="regularcalculator.html">Regular</a>
        <a class="side-tab active" href="scientificcalculator.html" aria-current="page">Scientific</a>
        <a class="side-tab" href="colorcalculator.html">Color</a>
        <a class="side-tab" href="moneyconverter.html">Money</a>
    </nav>
    <div class="settings-launcher">
        <section class="settings-panel" id="settings-panel" hidden aria-labelledby="settings-title">
            <button class="settings-close" id="settings-close" type="button" aria-label="Close settings">×</button>
            <h2 id="settings-title">Colors</h2>
            <div class="settings-content">
                <p class="settings-section-title">Colors</p>
                <label class="color-setting">Accent <input type="color" data-color-variable="--accent" value="#e85d45"></label>
                <label class="color-setting">Ink <input type="color" data-color-variable="--ink" value="#152333"></label>
                <label class="color-setting">Paper <input type="color" data-color-variable="--paper" value="#f5f1e9"></label>
                <label class="color-setting">Panel <input type="color" data-color-variable="--panel" value="#fffdf8"></label>
                <p class="settings-section-title">Typography</p>
                <label class="font-setting">Font family <select id="font-family"><option value="Georgia">Georgia</option><option value="Arial">Arial</option><option value="Verdana">Verdana</option><option value="Courier New">Courier New</option></select></label>
                <label class="font-setting">Font size <span><input id="font-size" type="range" min="13" max="22" value="16"><output id="font-size-value">16px</output></span></label>
                <label class="font-setting">Line spacing <span><input id="line-height" type="range" min="1" max="2" step=".1" value="1.4"><output id="line-height-value">1.4</output></span></label>
            </div>
            <button class="settings-reset" id="settings-reset" type="button">Reset settings</button>
        </section>
        <button class="settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">Settings</button>
    </div>
<script>
    const display = document.getElementById('scientific-display');
    const angleMode = document.getElementById('angle-mode');
    let expression = '';
    let degrees = true;

    function render() { display.value = expression || '0'; }
    function toRadians(value) { return degrees ? value * Math.PI / 180 : value; }
    function compile(source) {
        let code = source
            .replaceAll('×', '*')
            .replaceAll('÷', '/')
            .replaceAll('−', '-')
            .replaceAll('π', 'Math.PI')
            .replace(/\be\b/g, 'Math.E')
            .replace(/\^/g, '**');
        code = code.replace(/\bsin\(/g, 'trigSin(')
            .replace(/\bcos\(/g, 'trigCos(')
            .replace(/\btan\(/g, 'trigTan(')
            .replace(/\blog\(/g, 'Math.log10(')
            .replace(/\bln\(/g, 'Math.log(')
            .replace(/\bsqrt\(/g, 'Math.sqrt(');
        return Function('trigSin', 'trigCos', 'trigTan', `"use strict"; return (${code})`)(
            value => Math.sin(toRadians(value)),
            value => Math.cos(toRadians(value)),
            value => Math.tan(toRadians(value))
        );
    }
    function calculate() {
        try {
            const result = Number(compile(expression));
            if (!Number.isFinite(result)) throw new Error();
            expression = String(Number(result.toFixed(10)));
        } catch {
            expression = '';
            display.value = 'Error';
        }
        render();
    }
    document.querySelector('.scientific-keys').addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        const { action, value } = button.dataset;
        if (action === 'clear') expression = '';
        else if (action === 'backspace') expression = expression.slice(0, -1);
        else if (action === 'equals') return calculate();
        else expression += value;
        render();
    });
    angleMode.addEventListener('click', () => {
        degrees = !degrees;
        angleMode.textContent = degrees ? 'DEG' : 'RAD';
        angleMode.setAttribute('aria-label', degrees ? 'Switch to radians' : 'Switch to degrees');
    });
    document.addEventListener('keydown', event => {
        const key = event.key;
        if (/^[0-9.]$/.test(key)) expression += key;
        else if ('+-*/%^()'.includes(key)) expression += key.replace('*', '×').replace('/', '÷').replace('-', '−');
        else if (key === 'Enter' || key === '=') return calculate();
        else if (key === 'Backspace') expression = expression.slice(0, -1);
        else if (key === 'Escape') expression = '';
        else return;
        render();
    });
</script>
<script src="settings.js"></script>
</body>
</html>
