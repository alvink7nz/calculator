<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="mark">∿</div>
        <div><h1>Mathegraphical</h1><p class="subtitle">A simple calculator</p></div>
      </div>
      <div class="hint">Keyboard supported</div>
    </header>
    <main class="calculator-main">
      <section class="calculator" aria-label="Calculator">
        <input id="display" type="text" value="0" aria-label="Calculator display" readonly>
        <section class="keys">
          <button class="clear" data-action="clear">C</button>
          <button data-action="backspace">⌫</button>
          <button class="operator" data-value="%">%</button>
          <button class="operator" data-value="÷">÷</button>
          <button data-value="7">7</button><button data-value="8">8</button>
          <button data-value="9">9</button><button class="operator" data-value="×">×</button>
          <button data-value="4">4</button><button data-value="5">5</button>
          <button data-value="6">6</button><button class="operator" data-value="−">−</button>
          <button data-value="1">1</button><button data-value="2">2</button>
          <button data-value="3">3</button><button class="operator" data-value="+">+</button>
          <button data-value="0">0</button><button data-value=".">.</button>
          <button class="equals" data-action="equals">=</button>
        </section>
      </section>
    </main>
  </div>
  <nav class="side-tabs" aria-label="Calculator navigation">
    <a class="side-tab" href="index.html">Home</a>
    <a class="side-tab" href="graphingcalculator.html">Graphing</a>
    <a class="side-tab active" href="regularcalculator.html" aria-current="page">Regular</a>
    <a class="side-tab" href="scientificcalculator.html">Scientific</a>
  </nav>
  <script>
    const display = document.getElementById('display');
    let expression = '';

    function render() { display.value = expression || '0'; }
    function calculate() {
      try {
        const result = Function(`"use strict"; return (${expression.replaceAll('×', '*').replaceAll('÷', '/').replaceAll('−', '-')})`)();
        if (!Number.isFinite(result)) throw new Error();
        expression = String(Number(result.toFixed(10)));
      } catch { expression = ''; display.value = 'Error'; }
      render();
    }
    document.querySelector('.keys').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      const { action } = button.dataset;
      if (action === 'clear') expression = '';
      else if (action === 'backspace') expression = expression.slice(0, -1);
      else if (action === 'equals') return calculate();
      else {
        const value = button.dataset.value;
        if (value === '.' && /\d*\.\d*$/.test(expression.split(/[+−×÷%]/).pop())) return;
        expression += value;
      }
      render();
    });
    document.addEventListener('keydown', event => {
      const key = event.key;
      if (/^[0-9.]$/.test(key)) expression += key;
      else if ('+-*/%'.includes(key)) expression += key.replace('*', '×').replace('/', '÷').replace('-', '−');
      else if (key === 'Enter' || key === '=') return calculate();
      else if (key === 'Backspace') expression = expression.slice(0, -1);
      else if (key === 'Escape') expression = '';
      else return;
      render();
    });
  </script>
</body>
</html>
